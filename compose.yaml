services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: development-only-password
      POSTGRES_DB: scanner
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
  api:
    build: .
    environment: &env
      DATABASE_URL: postgresql://scanner:development-only-password@postgres/scanner
      REDIS_URL: redis://redis:6379
      API_TOKENS_JSON: '{"development-only-key":"demo"}'
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: .
    command: ["python", "worker.py"]
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
      demo: {condition: service_started}
  demo:
    build: .
    command: ["uvicorn", "demo:app", "--host", "0.0.0.0", "--port", "8080"]
  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      API_TOKEN: development-only-key
    ports: ["127.0.0.1:3002:3000"]
volumes:
  pgdata:
